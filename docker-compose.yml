# Convex self-hosted — local-only backend for EVOX.
#
# Runs the open-source Convex backend + dashboard on your machine.
# Default storage is embedded SQLite (in the `convex_data` volume) — no
# external Postgres/MySQL/S3 required for local development.
#
# Quick start:
#   docker compose up -d
#   docker compose exec convex-backend ./generate_admin_key.sh   # → admin key
# Full guide: docs/SELF-HOSTED-LOCAL.md
# Upstream (advanced options): https://github.com/get-convex/convex-backend/tree/main/self-hosted

services:
  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210" # API + client connections → NEXT_PUBLIC_CONVEX_URL
      - "3211:3211" # HTTP actions / site origin → NEXT_PUBLIC_CONVEX_SITE_URL
    volumes:
      - convex_data:/convex/data
    environment:
      - INSTANCE_NAME=evox-local
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - DISABLE_BEACON=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      start_period: 10s
      timeout: 5s
      retries: 10

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791" # Convex admin dashboard → http://127.0.0.1:6791
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3210
    depends_on:
      convex-backend:
        condition: service_healthy

volumes:
  convex_data:
